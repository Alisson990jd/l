name: FutData daily update

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia 06:17 UTC (03:17 em Brasília)
  workflow_dispatch:
    inputs:
      sportmonks_start:
        description: "Sportmonks: data inicial (YYYY-MM-DD) para reprocessar um período"
        required: false
      sportmonks_end:
        description: "Sportmonks: data final (YYYY-MM-DD)"
        required: false

concurrency:
  group: futdata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      FUTDATA_OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r futdata/requirements.txt

      - name: Sportmonks (Premier League, Bundesliga, Dinamarca, Escócia)
        if: env.SPORTMONKS_TOKEN != ''
        continue-on-error: true
        run: python -m futdata.sportmonks ${{ inputs.sportmonks_start }} ${{ inputs.sportmonks_end }}

      - name: API-Football (jogos do dia no mundo todo)
        if: env.APIFOOTBALL_KEY != ''
        continue-on-error: true
        run: python -m futdata.api_football

      - name: football-data.co.uk e seleções
        continue-on-error: true
        run: python -m futdata.open_sources football_data international

      - name: Transfermarkt (segundas-feiras)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m futdata.open_sources transfermarkt
          fi

      - name: Atualizar README e enviar ao Hugging Face
        run: |
          python -m futdata.readme
          python -c "from futdata.common import upload; upload('Daily update')"
