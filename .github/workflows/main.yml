name: Create Android-x86 VM with VNC and Ngrok

on:
  workflow_dispatch:

jobs:
  create-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install required dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients virt-manager bridge-utils dnsmasq-base wget tar

      - name: Download Android-x86 ISO
        run: |
          wget -O android-x86.iso "https://downloads.sourceforge.net/project/android-x86/Release%209.0/android-x86_64-9.0-r2.iso?ts=gAAAAABn0XMq9eFOcVhJ11mQrWnlrNBY1DliTCEGE18fQzu0GjcHqOilnvxunqrEmN4jAb6UwvCQ8fHQi5KgsstXvaOb1RBE_g%3D%3D&use_mirror=cfhcable&r=https%3A%2F%2Fsourceforge.net%2Fprojects%2Fandroid-x86%2Ffiles%2FRelease%25209.0%2F"

      - name: Download and install ngrok
        run: |
          wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
          tar -xvzf ngrok-v3-stable-linux-amd64.tgz
          ./ngrok authtoken 1vgZrCA9yJDURy3OK1gNbS2G610_3CX2e2bqT4Ee88uMBk5he

      - name: Expose VNC with ngrok
        run: |
          ./ngrok tcp 5900 --log=stdout > ngrok.log &
          sleep 10
          NGROK_URL=$(grep -o 'tcp://[^ ]*' ngrok.log | sed 's/tcp:\/\//http:\/\/0.tcp.ngrok.io:/')
          echo "Ngrok URL: $NGROK_URL"
          echo "VNC Access: Use the above URL and port to connect via VNC."

      - name: Start Android-x86 VM with QEMU (with built-in VNC)
        run: |
          qemu-system-x86_64 \
            -m 4096 \
            -smp 4 \
            -vga std \
            -display vnc=:0 \
            -cdrom android-x86.iso \
            -boot d \
            -net nic,model=virtio \
            -net user,hostfwd=tcp::2222-:22 \
            -daemonize
          echo "Android-x86 VM started. Connect via VNC using the ngrok URL."

      - name: Keep VM running for 3 hours
        run: |
          echo "VM will stay online for 3 hours..."
          sleep 10800 # 3 hours = 3 * 60 * 60 seconds
          echo "Shutting down VM after 3 hours."
